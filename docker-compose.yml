services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sre}
      POSTGRES_DB: multimodal_sre
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U sre -d multimodal_sre"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports: ["6333:6333","6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sre:${POSTGRES_PASSWORD:-sre}@postgres:5432/multimodal_sre
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      PROMETHEUS_URL: http://prometheus:9090
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deterministic}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5-coder:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EXECUTION_MODE: ${EXECUTION_MODE:-simulation}
      MAX_INVESTIGATION_LOOPS: 3
      ANOMALY_THRESHOLD: 0.65
      LOG_LEVEL: INFO
    volumes:
      - ./data/runbooks:/app/data/runbooks:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      qdrant: {condition: service_started}
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery","-A","app.workers.celery_app:celery_app","worker","--loglevel=INFO","--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://sre:${POSTGRES_PASSWORD:-sre}@postgres:5432/multimodal_sre
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      PROMETHEUS_URL: http://prometheus:9090
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-deterministic}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5-coder:7b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EXECUTION_MODE: simulation
    volumes:
      - ./data/runbooks:/app/data/runbooks:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      qdrant: {condition: service_started}
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [backend]
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment: [GF_SECURITY_ADMIN_USER=admin,GF_SECURITY_ADMIN_PASSWORD=admin]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317","4318:4318"]
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  grafana_data:
