apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: multimodal-sre}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: backend
          image: multimodal-sre-backend:latest
          ports: [{containerPort: 8000}]
          env:
            - {name: DATABASE_URL, value: postgresql+asyncpg://sre:sre@postgres:5432/multimodal_sre}
            - {name: REDIS_URL, value: redis://redis:6379/0}
            - {name: QDRANT_URL, value: http://qdrant:6333}
            - {name: EXECUTION_MODE, value: simulation}
          readinessProbe: {httpGet: {path: /api/v1/health, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /api/v1/health, port: 8000}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: multimodal-sre}
spec: {selector: {app: backend}, ports: [{port: 8000, targetPort: 8000}]}
