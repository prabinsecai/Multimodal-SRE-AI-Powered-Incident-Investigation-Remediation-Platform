apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: multimodal-sre}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - {name: frontend, image: multimodal-sre-frontend:latest, ports: [{containerPort: 3000}]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: multimodal-sre}
spec: {type: LoadBalancer, selector: {app: frontend}, ports: [{port: 80, targetPort: 3000}]}
