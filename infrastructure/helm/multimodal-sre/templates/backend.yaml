apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-backend}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-backend}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-backend}}
    spec:
      containers:
      - name: backend
        image: {{ .Values.backend.image }}
        ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-backend}
spec: {selector: {app: {{ .Release.Name }}-backend}, ports: [{port: 8000, targetPort: 8000}]}
